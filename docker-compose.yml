services:
  postgres:
    image: postgres:16-alpine
    container_name: stellarpulse-pg
    environment:
      POSTGRES_DB: stellarpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - stellarpulse_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stellarpulse-redis
    ports:
      - '6379:6379'

volumes:
  stellarpulse_pgdata: